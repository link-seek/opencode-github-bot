name: "Setup Bun (GitHub first, npm fallback)"
description: "Install Bun via oven-sh/setup-bun; on download failure fall back to npm i -g bun. Never fail on single-registry outage."
inputs:
  bun-version:
    description: "Bun version for the primary path (default: latest)"
    required: false
    default: "latest"
  fallback-version:
    description: "Bun version for the npm fallback (default: same as bun-version; use latest to prove the fallback path)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: primary
      uses: oven-sh/setup-bun@v2
      continue-on-error: true
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: steps.primary.outcome == 'failure'
      shell: bash
      run: |
        echo "setup-bun failed, falling back to npm registry" >&2
        npm i -g "bun@${{ inputs.fallback-version != '' && inputs.fallback-version || inputs.bun-version }}"
        echo "$(npm bin -g)" >> "$GITHUB_PATH"
    - shell: bash
      run: bun --version
