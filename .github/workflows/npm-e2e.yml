name: npm-e2e
on:
  push:
    branches: [npm-source]
jobs:
  e2e:
    if: contains(github.event.head_commit.message, 'npm-e2e-probe')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: npm-source
      - uses: ./
        with:
          model: opencode/beam-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: intake
          issue-number: "21"
          package-source: npm
          package-version: 0.3.0
          recall-mode: keyword
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
