name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run OpenCode review
        uses: ./
        with:
          model: opencode/beam-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: review
          pr-number: ${{ github.event.inputs.pr-number || github.event.pull_request.number }}
          require-evidence: "false"
          require-pinned-actions: "false"
          collect-feedback: "true"
          review-prompt: |
            Review this PR for the opencode-github-bot repo.
            Flag: bugs, missing error handling, security issues, type errors.
            Do NOT comment on style or naming.
            If clean, reply briefly.
