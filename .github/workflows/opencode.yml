name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

jobs:
  opencode:
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'assigned')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Run OpenCode (review)
        if: github.event_name != 'issues'
        uses: ./
        with:
          model: opencode/beam-free
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: review
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          require-evidence: "false"
          require-pinned-actions: "false"
          collect-feedback: "true"

      - name: Run OpenCode (issue fix)
        if: github.event_name == 'issues'
        uses: ./
        with:
          model: opencode/beam-free
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: fix-issue
          issue-number: ${{ github.event.issue.number }}