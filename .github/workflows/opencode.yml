name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Issue number to process'
        required: true
        type: string
      mode:
        description: 'split-plan (default) or intake (re-run triage)'
        required: false
        default: 'split-plan'
        type: string

jobs:
  triage:
    # New human issues get auto-triaged on open. Bot-created sub-issues
    # ("Part of #N") are pre-triaged and skipped inside intake-run.
    # workflow_dispatch with mode=intake allows re-running triage for one issue.
    if: (github.event_name == 'issues' && github.event.action == 'opened') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'intake'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      - name: Run intake triage
        uses: ./
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: intake
          issue-number: ${{ github.event.issue.number || github.event.inputs.issue-number }}
          recall-mode: keyword
          collect-feedback: "false"

  opencode:
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode') ||
        (contains(github.event.comment.body, 'approve split') && !contains(github.event.comment.body, 'pm-split-plan'))) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'assigned') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Run OpenCode (review)
        if: github.event_name != 'issues' && github.event_name != 'workflow_dispatch' && !contains(github.event.comment.body, 'approve split')
        uses: ./
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          package-source: ${{ github.ref == 'refs/heads/main' && 'npm' || 'repo' }}
          package-version: latest
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: review
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          require-evidence: "false"
          require-pinned-actions: "false"
          collect-feedback: "true"

      - name: Run OpenCode (issue fix)
        if: github.event_name == 'issues'
        uses: ./
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          package-source: ${{ github.ref == 'refs/heads/main' && 'npm' || 'repo' }}
          package-version: latest
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: fix-issue
          issue-number: ${{ github.event.issue.number }}

      - name: Run split plan (manual)
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'split-plan')
        uses: ./
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: split-plan
          issue-number: ${{ github.event.inputs.issue-number }}

      - name: Run split apply (human approved)
        # pm-split-plan exclusion: the draft comment itself contains approval
        # wording and must never self-trigger (dogfood #46 proved it does).
        if: (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, 'approve split') && !contains(github.event.comment.body, 'pm-split-plan')
        uses: ./
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: split-apply
          issue-number: ${{ github.event.issue.number || github.event.pull_request.number }}