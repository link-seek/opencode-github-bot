name: jev-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live Jev call (1 question, negligible cost)
        env:
          JEV_URL: ${{ vars.JEV_URL }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          : "${JEV_URL:?need vars.JEV_URL}"
          : "${JEV_MODEL:?need vars.JEV_MODEL}"
          curl -sS -m 60 "$JEV_URL" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$JEV_MODEL\",\"state\":\"probe: the sky is blue\",\"questions\":{\"sky_blue\":{\"type\":\"noul\",\"instructions\":\"Is the sky blue?\"}}}" \
            -o /tmp/jev-probe.json
          cat /tmp/jev-probe.json | head -c 1500; echo
          python3 -c "import json,sys; d=json.load(open('/tmp/jev-probe.json')); a=d.get('answers',{}).get('sky_blue',{}); print('noul=',a.get('noul'),'model=',d.get('model')); assert isinstance(a.get('noul'),(int,float)) and a['noul']>0.5, 'probe failed'"
