name: jev-probe

on:
  workflow_dispatch:
    inputs:
      jev-model:
        description: 'Model variable JSON, e.g. {"cli":"jev-1.13-free","apiBase":"https://opencode.ai/inference/systemone/v1/systemone"}'
        required: false
        default: '{"cli":"jev-1.13-free","apiBase":"https://opencode.ai/inference/systemone/v1/systemone"}'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live Jev call (1 question, negligible cost)
        env:
          JEV_MODEL_INPUT: ${{ inputs.jev-model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
        run: |
          set -euo pipefail
          MODEL="${JEV_MODEL_INPUT:?need jev-model input}"
          # Model variable: JSON {"cli","apiBase"} (legacy space-separated/bare id).
          PARSED="$(python3 - "$MODEL" <<'EOF'
          import json, sys
          v = sys.argv[1].strip()
          cli, base = "", ""
          try:
              if v.startswith("{"):
                  o = json.loads(v)
                  if not isinstance(o, dict):
                      raise ValueError("model JSON must be an object")
                  c = o.get("cli")
                  b = o.get("apiBase")
                  cli = c.strip() if isinstance(c, str) else ""
                  base = b.strip() if isinstance(b, str) else ""
              else:
                  p = v.split()
                  cli, base = (p[0].strip() if p else ""), (p[1].strip() if len(p) > 1 else "")
          except Exception as e:
              print(f"reject: bad model value: {e}", file=sys.stderr)
              raise SystemExit(1)
          mid = cli.rsplit("/", 1)[-1].strip() if cli else ""
          print(mid)
          print(base or "https://opencode.ai/inference/systemone/v1/systemone")
          EOF
          )"
          MODEL_ID="$(printf '%s' "$PARSED" | sed -n '1p')"
          JEV_URL="$(printf '%s' "$PARSED" | sed -n '2p')"
          if [ -z "$MODEL_ID" ]; then echo "reject: empty model id: $MODEL" >&2; exit 1; fi
          : "${OPENCODE_API_KEY:?need secrets.OPENCODE_API_KEY for probe (free needs key too)}"
          python3 - "$JEV_URL" "$MODEL_ID" <<'EOF' > /tmp/jev-probe.json
          import json, os, sys, urllib.request, urllib.error
          url, model = sys.argv[1], sys.argv[2]
          fast = os.environ.get("KEY_FAST", "") or os.environ.get("OPENCODE_API_KEY", "")
          bulk = os.environ.get("KEY_BULK", "") or os.environ.get("OPENCODE_API_KEY_BULK", "")
          keys = [k for k in [fast, bulk] if k]
          if not keys:
            print("missing OPENCODE_API_KEY (fast lane)", file=sys.stderr)
            raise SystemExit(1)
          body = json.dumps({
              "model": model,
              "state": "probe: the sky is blue",
              "questions": {"sky_blue": {"type": "noul", "instructions": "Is the sky blue?"}},
          }).encode()
          def attempt(key):
              headers = {"Content-Type": "application/json",
                         # opencode.ai sits behind Cloudflare, which bans Python-urllib's
                         # default UA (403/error 1010). curl UA is verified to pass.
                         "User-Agent": "curl/8.5.0",
                         "Authorization": f"Bearer {key}"}
              req = urllib.request.Request(url, data=body, headers=headers)
              return urllib.request.urlopen(req, timeout=60).read().decode()
          for i, key in enumerate(keys):
              try:
                  print(attempt(key), end="")
                  break
              except urllib.error.HTTPError as e:
                  msg = f"HTTP {e.code}: {e.read().decode(errors='replace')[:300]}"
                  print(f"key[{i}] {msg}", file=sys.stderr)
                  if e.code != 429 or i == len(keys) - 1:
                      print(msg, end="")
                      raise SystemExit(1)
                  print("rate-limited, failing over to backup key", file=sys.stderr)
              except Exception as e:
                  msg = f"REQUEST FAILED: {type(e).__name__}: {e}"
                  print(msg, file=sys.stderr)
                  print(msg, end="")
                  raise SystemExit(1)
          EOF
          head -c 1500 /tmp/jev-probe.json; echo
          python3 -c "import json; d=json.load(open('/tmp/jev-probe.json')); a=d.get('answers',{}).get('sky_blue',{}); print('noul=',a.get('noul'),'model=',d.get('model')); assert isinstance(a.get('noul'),(int,float)) and a['noul']>0.5, 'probe failed'"
