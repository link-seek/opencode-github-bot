name: jev-probe

on:
  workflow_dispatch:
    inputs:
      jev-model:
        description: "JEV_MODEL value: bare/opencode/ id -> gateway, typesafe/ id -> direct (default: free baseline)"
        required: false
        default: "jev-1.13-free"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live Jev call (1 question, negligible cost)
        env:
          JEV_MODEL_INPUT: ${{ inputs.jev-model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          MODEL="${JEV_MODEL_INPUT:?need jev-model input}"
          case "$MODEL" in
            typesafe/*)
              JEV_URL="https://api.typesafe.ai/v1/systemone"
              MODEL_ID="${MODEL#typesafe/}"
              KEY="${TS_API_KEY:?need secrets.TS_API_KEY for direct probe}"
              ;;
            opencode/*)
              JEV_URL="https://opencode.ai/inference/systemone/v1/systemone"
              MODEL_ID="${MODEL#opencode/}"
              KEY="${OPENCODE_API_KEY:?need secrets.OPENCODE_API_KEY for gateway probe}"
              ;;
            zen/*)
              JEV_URL="https://opencode.ai/zen/v1/systemone"
              MODEL_ID="${MODEL#zen/}"
              KEY="${OPENCODE_API_KEY:-}"
              : "${KEY:?need secrets.OPENCODE_API_KEY for Zen probe (free needs key too)}"
              ;;
            *)
              JEV_URL="https://opencode.ai/inference/systemone/v1/systemone"
              MODEL_ID="$MODEL"
              KEY="${OPENCODE_API_KEY:?need secrets.OPENCODE_API_KEY for gateway probe}"
              ;;
          esac
          python3 - "$JEV_URL" "$KEY" "$MODEL_ID" <<'EOF' > /tmp/jev-probe.json
          import json, sys, urllib.request, urllib.error
          url, key, model = sys.argv[1], sys.argv[2], sys.argv[3]
          body = json.dumps({
              "model": model,
              "state": "probe: the sky is blue",
              "questions": {"sky_blue": {"type": "noul", "instructions": "Is the sky blue?"}},
          }).encode()
          headers = {"Content-Type": "application/json"}
          if key:
              headers["Authorization"] = f"Bearer {key}"
          req = urllib.request.Request(url, data=body, headers=headers)
          try:
              resp = urllib.request.urlopen(req, timeout=60)
              print(resp.read().decode(), end="")
          except urllib.error.HTTPError as e:
              msg = f"HTTP {e.code}: {e.read().decode(errors='replace')[:1000]}"
              print(msg, file=sys.stderr)
              print(msg, end="")
              raise SystemExit(1)
          except Exception as e:
              msg = f"REQUEST FAILED: {type(e).__name__}: {e}"
              print(msg, file=sys.stderr)
              print(msg, end="")
              raise SystemExit(1)
          EOF
          head -c 1500 /tmp/jev-probe.json; echo
          python3 -c "import json; d=json.load(open('/tmp/jev-probe.json')); a=d.get('answers',{}).get('sky_blue',{}); print('noul=',a.get('noul'),'model=',d.get('model')); assert isinstance(a.get('noul'),(int,float)) and a['noul']>0.5, 'probe failed'"
