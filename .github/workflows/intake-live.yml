name: intake-live
on:
  push:
    branches: [jev-docs-aligned]
jobs:
  live:
    if: contains(github.event.head_commit.message, 'intake-live-probe')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jev-docs-aligned
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: link-seek/opencode-github-bot
          ISSUE_NUMBER: "18"
          RECALL_MODE: keyword
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun scripts/intake-run.ts
