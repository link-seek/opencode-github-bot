name: replay-live
on:
  push:
    branches: [paper-prep]
jobs:
  replay:
    if: contains(github.event.head_commit.message, 'replay-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-prep
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPLAY_ISSUES: "3,5"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_BASE_URL: https://opencode.ai/inference/openai/v1
          LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_JUDGE_MODEL: opencode/glm-5.3-flash
        run: bun scripts/replay.ts --policy all
