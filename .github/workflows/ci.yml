name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install OpenCode v2
        run: curl -fsSL https://opencode.ai/v2/install | bash
      - name: Smoke test — agent loads and responds
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          # Single line: multi-line $() breaks the runner's script rendering.
          CLI_MODEL="$(MODEL="$OPENCODE_MODEL" python3 -c "import json,os; v=os.environ.get('MODEL','').strip(); o=json.loads(v) if v.startswith('{') else None; print(str(o.get('cli','')).strip() if isinstance(o,dict) else (v.split()[0] if v.split() else ''))")"
          : "${CLI_MODEL:?empty OPENCODE_MODEL}"
          opencode run --agent github-bot --model "$CLI_MODEL" "What is 2+2? Reply with just the number." | tee /tmp/smoke.log
          grep -q "4" /tmp/smoke.log || { echo "Smoke test failed"; cat /tmp/smoke.log; exit 1; }