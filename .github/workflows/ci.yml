name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install OpenCode v2
        run: curl -fsSL https://opencode.ai/v2/install | bash
      - name: Smoke test — agent loads and responds
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode run --agent github-bot --model "${{ vars.OPENCODE_REVIEW_MODEL }}" "What is 2+2? Reply with just the number." | tee /tmp/smoke.log
          grep -q "4" /tmp/smoke.log || { echo "Smoke test failed"; cat /tmp/smoke.log; exit 1; }