name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install OpenCode v2
        run: curl -fsSL https://opencode.ai/v2/install | bash
      - name: Smoke test — agent loads and responds
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          CLI_MODEL="$(python3 -c "import json,sys; v=sys.argv[1].strip(); print(json.loads(v).get('cli','') if v.startswith('{') else v.split()[0] if v.split() else '')" "${{ vars.OPENCODE_MODEL }}")"
          : "${CLI_MODEL:?empty OPENCODE_MODEL}"
          opencode run --agent github-bot --model "$CLI_MODEL" "What is 2+2? Reply with just the number." | tee /tmp/smoke.log
          grep -q "4" /tmp/smoke.log || { echo "Smoke test failed"; cat /tmp/smoke.log; exit 1; }