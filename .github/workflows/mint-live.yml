name: mint-live
on:
  push:
    branches: [recall-prototype]
jobs:
  live:
    if: contains(github.event.head_commit.message, 'mint-live-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recall-prototype
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - env:
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: bun -e "
import { cfConfigFromEnv, cfMintChild } from './scripts/cf-recall.ts';
const cfg = cfConfigFromEnv();
if (!cfg) { console.log('NO_CFG'); process.exit(0); }
const child = await cfMintChild(cfg, 600);
console.log(child ? 'MINT_OK len=' + child.length : 'MINT_NULL_FALLBACK_KEYWORD');
"
