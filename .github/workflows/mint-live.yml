name: mint-live
on:
  push:
    branches: [recall-prototype]
jobs:
  live:
    if: contains(github.event.head_commit.message, 'mint-live-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recall-prototype
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - env:
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: bun scripts/mint-live-demo.ts
