name: chat-probe

on:
  workflow_dispatch:
    inputs:
      chat-model:
        description: 'Model variable JSON, e.g. {"cli":"opencode-go/beam-free","apiBase":"https://opencode.ai/inference/go/openai/v1"}'
        required: false
        default: '{"cli":"opencode-go/beam-free","apiBase":"https://opencode.ai/inference/go/openai/v1"}'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live chat call (1 question, negligible cost)
        env:
          CHAT_MODEL_INPUT: ${{ inputs.chat-model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
        run: |
          set -euo pipefail
          MODEL="${CHAT_MODEL_INPUT:?need chat-model input}"
          PARSED="$(python3 - "$MODEL" <<'EOF'
          import json, sys
          v = sys.argv[1].strip()
          cli, base = "", ""
          try:
              if v.startswith("{"):
                  o = json.loads(v)
                  if not isinstance(o, dict):
                      raise ValueError("model JSON must be an object")
                  c = o.get("cli")
                  b = o.get("apiBase")
                  cli = c.strip() if isinstance(c, str) else ""
                  base = b.strip() if isinstance(b, str) else ""
              else:
                  p = v.split()
                  cli, base = (p[0] if p else ""), (p[1] if len(p) > 1 else "")
          except Exception as e:
              print(f"reject: bad model value: {e}", file=sys.stderr)
              raise SystemExit(1)
          mid = cli.rsplit("/", 1)[-1].strip() if cli else ""
          print(mid)
          print(base or "https://opencode.ai/inference/openai/v1")
          EOF
          )"
          MODEL_ID="$(printf '%s' "$PARSED" | sed -n '1p')"
          CHAT_URL="$(printf '%s' "$PARSED" | sed -n '2p')"
          if [ -z "$MODEL_ID" ]; then echo "reject: empty model id: $MODEL" >&2; exit 1; fi
          : "${OPENCODE_API_KEY:?need secrets.OPENCODE_API_KEY}"
          # Go subscription endpoints require a session id header.
          SESSION_HDR=""
          if [[ "$CHAT_URL" == *"/inference/go/"* ]]; then
            SESSION_HDR="x-opencode-session: gh-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
          fi
          python3 - "$CHAT_URL" "$MODEL_ID" "$SESSION_HDR" <<'EOF' > /tmp/chat-probe.json
          import json, os, sys, urllib.request, urllib.error
          url, model = sys.argv[1], sys.argv[2]
          fast = os.environ.get("KEY_FAST", "") or os.environ.get("OPENCODE_API_KEY", "")
          bulk = os.environ.get("KEY_BULK", "") or os.environ.get("OPENCODE_API_KEY_BULK", "")
          keys = [k for k in [fast, bulk] if k]
          if not keys:
              print("missing OPENCODE_API_KEY (fast lane)", file=sys.stderr)
              raise SystemExit(1)
          extra = [a for a in sys.argv[3:] if a]
          body = json.dumps({
              "model": model,
              "messages": [{"role": "user", "content": "reply with exactly: OK"}],
              "max_tokens": 200,
          }).encode()
          def attempt(key):
              headers = {"Content-Type": "application/json",
                         # opencode.ai sits behind Cloudflare, which bans Python-urllib's
                         # default UA (403/error 1010). curl UA is verified to pass.
                         "User-Agent": "curl/8.5.0",
                         "Authorization": f"Bearer {key}"}
              for h in extra:
                  k, _, v = h.partition(":")
                  headers[k.strip()] = v.strip()
              url2 = url.rstrip("/") + "/chat/completions"
              req = urllib.request.Request(url2, data=body, headers=headers)
              return urllib.request.urlopen(req, timeout=60).read().decode()
          for i, key in enumerate(keys):
              try:
                  print(attempt(key), end="")
                  break
              except urllib.error.HTTPError as e:
                  msg = f"HTTP {e.code}: {e.read().decode(errors='replace')[:300]}"
                  print(f"key[{i}] {msg}", file=sys.stderr)
                  if e.code != 429 or i == len(keys) - 1:
                      print(msg, end="")
                      raise SystemExit(1)
                  print("rate-limited, failing over to backup key", file=sys.stderr)
              except Exception as e:
                  msg = f"REQUEST FAILED: {type(e).__name__}: {e}"
                  print(msg, file=sys.stderr)
                  print(msg, end="")
                  raise SystemExit(1)
          EOF
          head -c 800 /tmp/chat-probe.json; echo
          python3 -c "import json; d=json.load(open('/tmp/chat-probe.json')); m=d['choices'][0]['message']; t=((m.get('content') or '')+' '+str(m.get('reasoning_content') or '')); print('reply=',t.strip()[:120]); assert 'OK' in t.upper(), 'probe failed'"
