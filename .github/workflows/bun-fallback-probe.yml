name: bun-fallback-probe
on:
  push:
    branches: [ci-fallback]
jobs:
  probe:
    if: contains(github.event.head_commit.message, 'fallback-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-fallback
      # bogus version forces primary failure -> must take npm path
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "0.0.0-no-such-version"
          fallback-version: "latest"
      - run: bun --version && echo FALLBACK_OK
        shell: bash
