name: e2e-review

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test PR
        id: pr
        run: |
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          git checkout -b e2e-review-test
          echo "# E2E test" >> README.md
          git add README.md && git commit -m "test: e2e review trigger"
          git push origin e2e-review-test
          PR_URL=$(gh pr create --title "e2e: review test" --body "Test PR for E2E review validation." --base main)
          PR_NUM=${PR_URL##*/}
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Run OpenCode review
        uses: ./
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          package-source: repo
          package-version: latest
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: review
          pr-number: ${{ steps.pr.outputs.pr_number }}
          require-evidence: "false"
          require-pinned-actions: "false"
          collect-feedback: "true"
          review-prompt: "Review this PR. If clean, reply briefly. Flag any bugs."

      - name: Verify review posted
        run: |
          sleep 5
          COUNT=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json comments,reviews --jq '(.comments | length) + (.reviews | length)')
          echo "Review activity (comments+reviews): $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "FAIL: no review activity posted"; exit 1; }
          echo "PASS: review posted"

      - name: Cleanup
        if: always()
        run: |
          gh pr close ${{ steps.pr.outputs.pr_number }} --delete-branch 2>/dev/null || true